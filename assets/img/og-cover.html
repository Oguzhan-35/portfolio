<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG cover source</title>
<!--
  SOURCE FOR THE SOCIAL PREVIEW IMAGE (og:image).

  Renders at exactly 1200×630 — the size LinkedIn, WhatsApp and X expect.
  To regenerate after editing this file, from the portfolio folder with the
  dev server running on 4323:

    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot="shot.png" "http://localhost:4323/assets/img/og-cover.html"

  then convert shot.png to assets/img/og-cover.jpg (quality ~85).
-->
<style>
  @font-face {
    font-family: 'Manrope';
    font-weight: 400 800;
    font-display: block;
    src: url('../fonts/manrope-var-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122;
  }
  @font-face {
    font-family: 'Manrope';
    font-weight: 400 800;
    font-display: block;
    src: url('../fonts/manrope-var-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+1E00-1E9F, U+2C60-2C7F, U+A720-A7FF;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0A0B0D;
    color: #F3F5F7;
    font-family: 'Manrope', system-ui, sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 84px;
  }

  /* Same grid + brass glow as the site hero */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 80% 70% at 30% 40%, #000 25%, transparent 80%);
  }
  .glow {
    position: absolute;
    top: -30%; left: 8%;
    width: 780px; height: 620px;
    background: radial-gradient(ellipse at center, rgba(224,169,63,.16), transparent 62%);
    filter: blur(20px);
  }

  .row { position: relative; display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
  .mark { width: 60px; height: 60px; border-radius: 14px; display: block; }
  .studio {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 15px; letter-spacing: .22em; text-transform: uppercase;
    color: #707885;
  }

  h1 {
    position: relative;
    font-size: 92px;
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1;
    margin-bottom: 22px;
  }

  .role {
    position: relative;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: #A2AAB6;
    margin-bottom: 46px;
  }
  .role b { color: #E0A93F; font-weight: 700; }

  .meta {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 17px; letter-spacing: .1em; text-transform: uppercase;
    color: #707885;
  }
  .meta span.sep { color: #E0A93F; }

  .rule {
    position: absolute;
    left: 0; bottom: 0; height: 8px; width: 100%;
    background: linear-gradient(90deg, #E0A93F, #F2CA84 42%, transparent 88%);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="row">
    <img class="mark" src="logo-dark.png" alt="">
    <span class="studio">Koe Design</span>
  </div>

  <h1>Oğuzhan Kul</h1>
  <p class="role">Business Analyst Candidate <b>·</b> MIS Graduate</p>

  <div class="meta">
    <span>SQL</span><span class="sep">·</span>
    <span>Power BI</span><span class="sep">·</span>
    <span>Process Analysis</span><span class="sep">·</span>
    <span>İzmir, Türkiye</span>
  </div>

  <div class="rule"></div>
</body>
</html>
